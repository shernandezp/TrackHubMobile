<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TrackHubMobile</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/font-awesome/css/all.min.css" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="TrackHubMobile.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        html {
            height: 100%;
            width: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            padding-top: env(safe-area-inset-top);
            min-height: 100vh;
            width: 100%;
        }

        .app-content {
            background-color: white;
            color: black;
        }

        @media (prefers-color-scheme: dark) {
            .app-content {
                background-color: #0d1117;
                color: #e6edf3;
            }
        }

        div.splash {
            height: 100%;
            width: 100%;
        }

        .splash .center {
            margin: 0px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ── Custom map markers & clusters ──────────── */
        .custom-marker,
        .custom-cluster {
            background: none !important;
            border: none !important;
        }

        /* ── Leaflet popup overrides ────────────────── */
        .th-popup .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
            padding: 0;
            overflow: hidden;
        }

        .th-popup .leaflet-popup-content {
            margin: 0;
            line-height: 1.4;
        }

        .th-popup .leaflet-popup-tip {
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }

        .th-popup .leaflet-popup-close-button {
            top: 6px;
            right: 8px;
            color: #6c757d;
            font-size: 18px;
            font-weight: 400;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
        }

        .th-popup .leaflet-popup-close-button:hover {
            color: #1a1a2e;
        }

        .th-popup-content {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            color: #1a1a2e;
        }

        .th-popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 10px 12px 8px;
            border-bottom: 1px solid #f0f0f0;
        }

        .th-popup-title {
            font-weight: 700;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .th-popup-badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .th-popup-body {
            padding: 8px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .th-popup-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .th-popup-row i {
            width: 14px;
            text-align: center;
            color: #6c757d;
            font-size: 12px;
            flex-shrink: 0;
        }

        .th-popup-row span {
            font-size: 12.5px;
            line-height: 1.3;
        }

        /* ── Leaflet controls polish ────────────────── */
        .leaflet-control-zoom a {
            width: 34px !important;
            height: 34px !important;
            line-height: 34px !important;
            font-size: 16px !important;
            border-radius: 8px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12) !important;
            border: 1px solid rgba(0,0,0,0.08) !important;
            color: #1a1a2e !important;
            background: rgba(255,255,255,0.95) !important;
        }

        .leaflet-control-zoom {
            border: none !important;
            border-radius: 8px !important;
            overflow: hidden;
            box-shadow: none !important;
        }

        .leaflet-control-attribution {
            font-size: 10px !important;
            background: rgba(255,255,255,0.7) !important;
            padding: 2px 6px !important;
            border-radius: 4px;
        }
    </style>
</head>

<body class="app-content">

    <div id="app">
        <div class="splash">
            <p class="center"><i class="fas fa-circle-notch fa-2x fa-spin"></i></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="scripts/map.js"></script>
</body>

</html>
